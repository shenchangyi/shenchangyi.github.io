<!doctype html><html lang="zh-CN" data-hosting="static"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f6f1e5"><meta name="description" content="青原山水墨智慧导览：山水画卷、景点介绍、游览线路与游客服务。"><title>青原山 · 水墨智慧导览</title><link rel="stylesheet" href="mobile-guide.css">
<link rel="stylesheet" href="mobile-refinement.css"><link rel="stylesheet" href="commerce.css"></head><body><main id="guide-app">
<header class="masthead"><button class="brand" data-action="about" aria-label="青原山，景区介绍"><h1>青原山</h1><span class="brand-seal" aria-hidden="true">山水</span><span class="brand-copy">水墨智慧导览</span></button><div class="header-actions"><button class="icon-button" data-action="search" aria-label="搜索景点"><svg><use href="#i-search"/></svg></button><button class="icon-button" data-action="more" aria-label="更多导览设置"><svg><use href="#i-more"/></svg></button></div></header>
<div id="map-viewport" tabindex="0" role="region" aria-label="水墨地图，可拖动、双指缩放，方向键移动，加减键缩放"><div id="map-world">
<img id="map-image" src="assets/atlas/ink-overview.webp" alt="青原山全域水墨画稿，山林、田块、道路与水系" draggable="false" width="3840" height="2048" fetchpriority="high"><div id="detail-tiles" aria-hidden="true"></div><img id="compare-image" src="assets/atlas/satellite.jpg" alt="同一范围的百度卫星影像对照" draggable="false" hidden>
<svg id="route-layer" viewBox="0 0 3840 2048" aria-hidden="true"></svg><div class="atmosphere" aria-hidden="true"><span class="mist mist-one"></span><span class="mist mist-two"></span><span class="flight flight-one"><i class="bird"></i></span><span class="flight flight-two"><i class="bird"></i></span><span class="flight flight-three"><i class="bird"></i><i class="bird"></i><i class="bird"></i></span></div><span id="user-location" aria-label="当前设备位置，画稿对照仅供参考" hidden><i></i></span>
</div><div id="markers"></div></div>
<div class="map-top-note"><span id="zoom-level">远览 · 主要地标</span><button data-action="sources">资料</button></div><div class="compass" aria-label="地图北向朝上"><span>北</span><svg viewBox="0 0 24 32" aria-hidden="true"><path d="m12 1 8 26-8-5-8 5Z"/><path d="M12 1v21"/></svg></div>
<aside class="map-tools" aria-label="地图工具"><div class="category-rail" role="group" aria-label="地图分类">
<button data-action="filter" data-filter="all" aria-pressed="true"><svg><use href="#i-pin"/></svg><span>全部</span></button><button data-action="filter" data-filter="scenic" aria-pressed="false"><svg><use href="#i-temple"/></svg><span>景点</span></button><button data-action="filter" data-filter="facilities" aria-pressed="false"><svg><use href="#i-service"/></svg><span>服务</span></button><button data-action="toilet"><svg><use href="#i-toilet"/></svg><span>卫生间</span></button></div>
<div class="tool-group"><button data-action="market" aria-label="逛青原里示例商店"><svg><use href="#i-shop"/></svg><span>逛小店</span></button><button data-action="weather"><svg><use href="#i-weather"/></svg><span>天气</span></button><button data-action="events"><svg><use href="#i-calendar"/></svg><span>节目</span></button><button data-action="clear" aria-pressed="false"><svg><use href="#i-clear"/></svg><span>清屏</span></button></div></aside>
<div class="map-lower-controls"><button data-action="layers" class="paper-button"><svg><use href="#i-layers"/></svg><span>图层</span></button><button data-action="locate" class="paper-button locate"><svg><use href="#i-locate"/></svg><span>我在哪</span></button></div>
<button id="base-toggle" class="paper-button" data-action="base-toggle" aria-label="切换到卫星影像">卫星</button><div class="zoom-controls" aria-label="缩放地图"><button data-action="zoom-in" aria-label="放大地图"><svg><use href="#i-plus"/></svg></button><button data-action="zoom-out" aria-label="缩小地图"><svg><use href="#i-minus"/></svg></button><button data-action="fit">全览</button></div>
<div id="route-banner" hidden></div><div id="voice-player" hidden></div>
<div id="welcome-card"><img src="assets/guide/jingjusi.png" alt="净居寺手绘山门图标" width="68" height="68"><div><strong>一卷青绿，慢游青原</strong><p>双指放大，看见街巷与小店</p></div><button data-action="routes" aria-label="查看推荐路线"><svg><use href="#i-arrow"/></svg></button></div>
<p class="map-credit" id="map-credit">艺术化画稿，位置仅供浏览</p>
<nav class="bottom-nav" aria-label="主要导航"><button data-action="about" data-nav="about"><svg><use href="#i-mountain"/></svg><span>景区介绍</span></button><button data-action="routes" data-nav="routes"><svg><use href="#i-route"/></svg><span>推荐路线</span></button><button data-action="map" data-nav="map" aria-current="page"><svg><use href="#i-map"/></svg><span>地图</span></button><button data-action="list" data-nav="list"><svg><use href="#i-temple"/></svg><span>景点列表</span></button><button data-action="services" data-nav="services"><svg><use href="#i-service"/></svg><span>服务设施</span></button></nav>
<section id="sheet" class="sheet" aria-labelledby="sheet-title" hidden><div class="sheet-head"><button class="sheet-handle" data-action="expand" aria-label="展开详情" aria-expanded="false"><span></span></button><div class="sheet-heading"><h2 id="sheet-title" tabindex="-1"></h2><button class="icon-button" data-action="close-sheet" aria-label="收起详情"><svg><use href="#i-close"/></svg></button></div></div><div id="sheet-content"></div></section>
<button id="restore-ui" class="paper-button" data-action="clear" hidden><svg><use href="#i-clear"/></svg>恢复导览</button><div id="toast" role="status" aria-live="polite" hidden></div>
<dialog id="photo-viewer" aria-label="查看景点图片"><button class="icon-button" data-action="close-photo" aria-label="关闭图片"><svg><use href="#i-close"/></svg></button><img src="assets/guide/jingjusi.png" alt="净居寺手绘山门图标"><p></p></dialog><noscript><div class="noscript">启用 JavaScript 后可使用地图缩放和景点导览。</div></noscript>
</main><script type="module" src="mobile-guide.mjs"></script></body></html>
